[build]
  # Ausgeliefert wird NUR dist/ (scripts/build-public.mjs, Positivliste). Bis 03.11.2026 war die
  # Repo-Wurzel Publish-Ordner und Repo-Interna waren öffentlich.
  command = "node scripts/build-public.mjs"
  publish = "dist"
  functions = "netlify/functions"

# Redirect www to bare domain
[[redirects]]
  from = "https://www.cashflow48.online/*"
  to = "https://cashflow48.online/:splat"
  status = 301
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Prevent indexing of danke page
[[headers]]
  for = "/danke.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
